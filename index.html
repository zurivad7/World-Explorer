<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#1d6fb8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Explorer" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="World Explorer — a child-friendly geography game. Explore the world, discover countries, earn your passport."
    />

    <!-- Social sharing (Open Graph + Twitter). Absolute URLs so link unfurls work. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="World Explorer" />
    <meta property="og:title" content="World Explorer — a child-friendly geography game" />
    <meta
      property="og:description"
      content="Explore the world, discover countries, and earn your passport. A free, privacy-first geography game for kids."
    />
    <meta property="og:url" content="https://worldexplorer.cc/" />
    <meta property="og:image" content="https://worldexplorer.cc/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="World Explorer — a child-friendly geography game" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="World Explorer — a child-friendly geography game" />
    <meta
      name="twitter:description"
      content="Explore the world, discover countries, and earn your passport. A free, privacy-first geography game for kids."
    />
    <meta name="twitter:image" content="https://worldexplorer.cc/og-image.png" />

    <title>World Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
