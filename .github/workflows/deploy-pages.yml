name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Served at the apex custom domain worldexplorer.cc (see public/CNAME), so the base
# path is the root "/". (For the github.io sub-path it would be "/World-Explorer/".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          PAGES_BASE: /
          # Cloudflare Web Analytics beacon token (public, cookieless). Set it as a
          # repo Actions secret named CF_BEACON_TOKEN to enable analytics; when unset
          # the build simply omits the beacon.
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
        run: npm run build
      - name: Validate content
        run: npm run validate:content
      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
